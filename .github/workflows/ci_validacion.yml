name: Pipeline de Validacion de Inventario GEVISE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v3

    - name: Configurar Entorno de Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar Dependencias de Excel y Calidad
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl pytest flake8

    - name: Analizar Sintaxis e Indentaciones (Linter)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Ejecutar Pruebas de Integración de Celdas
      run: |
        pytest test_generador.py -v
